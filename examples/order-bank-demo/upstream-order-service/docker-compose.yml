# Infra only — MySQL for Order domain (separate from RMS reliable_message / Bank bank DB).
#
#   docker compose up -d
#
# Host JDBC: localhost:3307, database `order`, user `order` / `order` — see application.yml

name: upstream-order-infra

services:
  mysql:
    image: mysql:8.4
    container_name: upstream-order-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order
      MYSQL_USER: order
      MYSQL_PASSWORD: order
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - upstream_order_mysql:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot" ]
      interval: 5s
      timeout: 3s
      retries: 25
      start_period: 25s

volumes:
  upstream_order_mysql:
