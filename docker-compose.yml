services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eda
      POSTGRES_PASSWORD: eda_secret
      POSTGRES_DB: eda_designs
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U eda -d eda_designs" ]
      interval: 5s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.54
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "14250:14250" # gRPC (collector -> jaeger)

  prometheus:
    image: prom/prometheus:v2.49.1
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  eda-service:
    build: ./eda-spring-boot
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: eda
      DB_PASSWORD: eda_secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: eda-design-service
      EDA_SAMPLING_STRATEGY: rule_based
      EDA_SAMPLING_RATIO: "0.2"
      DEMO_FORCE_ERROR: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
