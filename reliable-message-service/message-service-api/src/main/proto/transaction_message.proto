syntax = "proto3";

package org.tus.tx.service.message.grpc;

option java_multiple_files = true;
option java_package = "org.tus.tx.service.message.grpc";
option java_outer_classname = "TransactionMessageProto";

service TransactionMessageService {
  // Publisher API: persist message (outbox) as WAITING_CONFIRM.
  rpc Publish(PublishRequest) returns (MessageResponse);

  // Semantic API: confirm message is ready to be sent (WAITING_CONFIRM -> SENDING).
  rpc ConfirmSend(ConfirmSendRequest) returns (MessageResponse);

  // Admin/query API: list messages by page.
  rpc ListPage(ListPageRequest) returns (ListPageResponse);
}

message PublishRequest {
  // Optional idempotency key. If empty, server generates one.
  string message_id = 1;
  string consumer_queue = 2;
  string message_body = 3;
  string message_data_type = 4;
  string field1 = 10;
  string field2 = 11;
  string field3 = 12;
}

message ConfirmSendRequest {
  string message_id = 1;
}

message ListPageRequest {
  int32 start = 1;
  int32 page_size = 2;
  string sort_by = 3;
  bool asc = 4;
}

message ListPageResponse {
  int32 start = 1;
  int32 page_size = 2;
  int64 total = 3;
  repeated MessageResponse elements = 4;
}

message MessageResponse {
  string message_id = 1;
  MessageStatus status = 2;
  int32 send_times = 3;
  int64 next_retry_at_epoch_ms = 4;
  string last_error = 5;
  string consumer_queue = 6;
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  WAITING_CONFIRM = 1;
  SENDING = 2;
  SENT = 3;
  DEAD = 4;
}

