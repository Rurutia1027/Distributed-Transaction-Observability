server:
  port: 8082

spring:
  application:
    name: downstream-bank-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/reliable_message?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: rms
    password: rms
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# Optional L2 feedback to RMS (ReportConsumeResult)
rms:
  grpc:
    host: 127.0.0.1
    port: 9090
  report:
    enabled: true
