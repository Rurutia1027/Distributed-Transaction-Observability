# Two-Phase RMS middleware stack: MySQL + Reliable Message Service (gRPC 9090, HTTP 8080)
#
# Usage (from this directory):
#   docker compose -f docker-compose.twophase.yml up -d --build
#
# Clients connect to gRPC: localhost:9090  (ReliableMessageService)
#
# MySQL runs db/init/twophase/*.sql on FIRST startup only (empty volume). Schema is
# managed by SQL, not Hibernate (SPRING_JPA_HIBERNATE_DDL_AUTO=none).
# Outbox gRPC/relay is OFF here (RMS_OUTBOX_ENABLED=false) until outbox init SQL exists.

name: rms-twophase

services:
  mysql:
    image: mysql:8.4
    container_name: rms-twophase-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reliable_message
      MYSQL_USER: rms
      MYSQL_PASSWORD: rms
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - rms_twophase_mysql_data:/var/lib/mysql
      # Runs .sql/.sh in sort order only when data dir is empty
      - ./db/init/twophase:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  rms:
    build:
      context: .
      dockerfile: Dockerfile
    image: rms-twophase:local
    container_name: rms-twophase-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/reliable_message?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: rms
      SPRING_DATASOURCE_PASSWORD: rms
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      RMS_OUTBOX_ENABLED: "false"
      GRPC_SERVER_PORT: "9090"
      SERVER_PORT: "8080"

volumes:
  rms_twophase_mysql_data:
