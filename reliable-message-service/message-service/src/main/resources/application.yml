spring:
  application:
    name: message-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/reliable_message?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: rms
    password: rms

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

grpc:
  server:
    port: 9090

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# MQ publisher switch:
# - rocketmq: use RocketMQ publisher (placeholder implementation, wires config)
mq:
  publisher: rocketmq

  rocketmq:
    name-server: 127.0.0.1:9876
    producer-group: reliable-message-producer
    send-timeout-ms: 3000
    retry-times: 2

